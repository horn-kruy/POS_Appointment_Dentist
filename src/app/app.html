<div class="app-layout">
  <app-sidebar></app-sidebar>
  <div class="main-wrapper">
    <app-topbar></app-topbar>
    <main class="content-area">
      <!-- Command Center Dashboard -->
      <app-dashboard *ngIf="dashboardService.currentNavView() === 'dashboard'"></app-dashboard>

      <!-- Appointments Schedule Page (`db.appointments`) -->
      <app-appointments-view *ngIf="dashboardService.currentNavView() === 'schedule'"></app-appointments-view>

      <!-- POS & Payments Ledger Page (`db.payments`) -->
      <app-payments-view *ngIf="dashboardService.currentNavView() === 'pos'"></app-payments-view>

      <!-- Doctors Roster Collection (`db.doctors`) -->
      <app-doctors-roster *ngIf="dashboardService.currentNavView() === 'doctors'"></app-doctors-roster>

      <!-- Patient Directory Collection (`db.patients`) -->
      <app-patient-directory *ngIf="dashboardService.currentNavView() === 'patients'"></app-patient-directory>

      <!-- Dental Services Collection (`db.services`) -->
      <app-dental-services *ngIf="dashboardService.currentNavView() === 'services'"></app-dental-services>

      <!-- Medicines Inventory Collection (`db.medicines`) -->
      <app-medicines-inventory *ngIf="dashboardService.currentNavView() === 'medicines'"></app-medicines-inventory>
    </main>
  </div>
</div>
